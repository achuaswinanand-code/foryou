<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ffd1dc, #fff);
        font-family: Arial, sans-serif;
    }

    .container {
        text-align: center;
        padding: 20px;
    }

    .letter-btn {
        font-size: 60px;
        background: none;
        border: none;
        cursor: pointer;
        transition: transform 0.3s;
    }

    .letter-btn:hover {
        transform: scale(1.1);
    }

    .letter-btn:disabled {
        cursor: default;
        opacity: 0.5;
    }

    .message-box {
        margin-top: 30px;
        padding: 20px;
        max-width: 320px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        font-size: 18px;
        line-height: 1.5;
        display: none;
        animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>

<body>

<div class="container">
    <button class="letter-btn" id="letterBtn">✉️</button>

    <div class="message-box" id="messageBox"></div>
</div>

<script>
    const messages = [
        "I know today feels scary, and it’s okay to feel that way.\nYou are safe, and this surgery is here to help you heal.",
        "You are stronger than you think.\nYou’ve already faced so much, and you are still standing.",
        "Very soon, this day will be just a memory.\nEasier days, lighter moments, and more smiles are waiting for you.",
        "I’m so proud of you.\nI’m right here with you—before, during, and after this.\nYou are loved more than you know ❤️"
    ];

    let index = 0;
    const button = document.getElementById("letterBtn");
    const box = document.getElementById("messageBox");

    button.addEventListener("click", () => {
        box.style.display = "block";
        box.textContent = messages[index];
        index++;

        if (index === messages.length) {
            button.disabled = true;
            button.textContent = "❤️";
        }
    });
</script>

</body>
</html>
