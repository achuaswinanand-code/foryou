<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>
<style>
body {
  background: linear-gradient(to bottom, #1a1a2e, #16213e);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding-top: 100px;
  overflow: hidden;
}

.heart {
  font-size: 60px;
  animation: beat 1s infinite;
}

@keyframes beat {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

button {
  margin-top: 30px;
  padding: 12px 25px;
  font-size: 16px;
  border: none;
  border-radius: 20px;
  background-color: #ff4d6d;
  color: white;
  cursor: pointer;
}

#hiddenMessage {
  display: none;
  margin-top: 20px;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="heart">❤️</div>

<h2>Open this before your surgery</h2>

<p id="typing"></p>

<button onclick="showMessage()">Click when you feel scared</button>

<div id="hiddenMessage">
  No matter how far I am, I am holding your hand right now.
  we will face this together and i will always be your side not for tody or tomorrow
  but for a life time,we will make it happen together.
  I am so proud of you.
  And i really love you❤️
</div>

<script>
let text = "You are not alone. Not today. Not ever.";
let i = 0;

function typeWriter() {
  if (i < text.length) {
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeWriter, 50);
  }
}

function showMessage() {
  document.getElementById("hiddenMessage").style.display = "block";
}

typeWriter();
</script>

</body>
</html>
